<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>여행 초대 | TripFLOW</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f7f7f7;color:#222;font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif}.card{width:min(100%,420px);background:#fff;border:1px solid #ebebeb;border-radius:24px;padding:32px 24px;text-align:center}.brand{font-size:23px;font-weight:800;letter-spacing:-.6px;color:#b83d22}.mark{display:grid;place-items:center;width:60px;height:60px;margin:0 auto 12px;border-radius:18px;background:#f36b4a;color:white;font-size:30px;font-weight:800}h1{font-size:24px;line-height:1.35;margin:24px 0 8px;letter-spacing:-.8px}p{margin:0 0 22px;color:#666;word-break:keep-all}.btn{display:block;border-radius:12px;padding:14px 12px;text-decoration:none;font-weight:700;margin:10px 0}.primary{background:#b83d22;color:white}.secondary{border:1px solid #ddd;color:#222}.hint{font-size:13px;margin:20px 0 0;color:#717171}.foot{font-size:12px;color:#717171;margin-top:28px}.btn:focus-visible{outline:3px solid #222;outline-offset:3px}[hidden]{display:none!important}
</style>
</head>
<body><main class="card">
<div class="mark" aria-hidden="true">T</div><div class="brand">TripFLOW</div>
<h1 id="heading">여행에 초대받았어요!</h1>
<p id="message">트립플로에서 함께 여행을 계획하고 일정을 공유해 보세요.</p>
<a id="open" class="btn primary" hidden>트립플로에서 열기</a>
<a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.flowsoftlabs.tripflow" rel="noreferrer">Google Play에서 설치</a>
<p class="hint" id="hint">앱 설치 후 원래 받은 초대 링크를 다시 열어 주세요. 메신저에서 앱이 열리지 않으면 외부 브라우저로 열어 보세요.<br>초대 링크는 발급 후 7일간 유효합니다.</p>
<noscript><p class="hint">앱을 열려면 JavaScript를 허용해 주세요.</p></noscript>
<div class="foot">FlowSoftLabs</div>
</main>
<script>
'use strict';
const tokens = new URLSearchParams(location.search).getAll('token');
const token = tokens.length === 1 ? tokens[0] : '';
if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token)) {
  const link = document.getElementById('open');
  link.href = 'com.flowsoftlabs.tripflow://invite?token=' + encodeURIComponent(token.toLowerCase());
  link.hidden = false;
} else {
  document.getElementById('heading').textContent = '유효하지 않은 초대 링크';
  document.getElementById('message').textContent = '여행 소유자에게 새 초대 링크를 요청해 주세요.';
  document.getElementById('hint').hidden = true;
}
</script></body></html>
